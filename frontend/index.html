<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>NORTHMINE | Operational Intelligence Layer for Mining</title>
    <meta name="description" content="NORTHMINE transforma datos provenientes de FMS y sistemas operacionales en analitica, perdidas ocultas, predicciones y recomendaciones para apoyar decisiones mineras."/>
    <meta name="theme-color" content="#080a0a"/>
    <meta name="robots" content="index,follow"/>
    <link rel="canonical" href="https://northmine-seenode-public-demo-3.seenode.app/"/>
    <meta property="og:title" content="NORTHMINE | Operational Intelligence Layer for Mining"/>
    <meta property="og:description" content="NORTHMINE transforma datos provenientes de FMS y sistemas operacionales en analitica, perdidas ocultas, predicciones y recomendaciones para apoyar decisiones mineras."/>
    <meta property="og:type" content="website"/>
    <meta property="og:image" content="/assets/brand/northmine-logo-master.png"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="NORTHMINE | Operational Intelligence Layer for Mining"/>
    <meta name="twitter:description" content="NORTHMINE transforma datos provenientes de FMS y sistemas operacionales en analitica, perdidas ocultas, predicciones y recomendaciones para apoyar decisiones mineras."/>
    <meta name="twitter:image" content="/assets/brand/northmine-logo-master.png"/>
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/brand/northmine-symbol-transparent.png"/>
    <link rel="apple-touch-icon" href="/assets/brand/northmine-symbol-transparent.png"/>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #080a0a; }
      .nm-splash-scene {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #080a0a;
        overflow: hidden;
      }
      .nm-splash-copy {
        position: relative;
        z-index: 3;
        text-align: center;
        color: #a9b0ad;
        font-size: 13px;
        letter-spacing: 0.05em;
        font-family: 'IBM Plex Sans', Segoe UI, Arial, sans-serif;
      }
      .nm-splash-truck {
        position: absolute;
        left: 0;
        bottom: 15%;
        z-index: 2;
        animation: nm-truck-run 6.5s linear infinite;
      }
      .nm-splash-truck img {
        display: block;
        width: 250px;
        height: auto;
      }
      .nm-splash-road {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 14%;
        height: 3px;
        background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.16) 0 30px, transparent 30px 60px);
        animation: nm-road-scroll 0.55s linear infinite;
      }
      .nm-splash-dots::after {
        content: '';
        animation: nm-splash-dots 1.2s steps(4, end) infinite;
      }
      @keyframes nm-splash-dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }
      @keyframes nm-truck-run {
        from { transform: translateX(-260px); }
        to { transform: translateX(108vw); }
      }
      @keyframes nm-road-scroll {
        from { background-position: 0 0; }
        to { background-position: -60px 0; }
      }
    </style>
    <script data-goatcounter="https://northmine.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="nm-splash-scene">
        <div class="nm-splash-copy">Cargando dinero<span class="nm-splash-dots"></span></div>
        <div class="nm-splash-road"></div>
        <div class="nm-splash-truck">
          <img src="/assets/brand/loading-truck.svg" alt="Camión cargando dinero"/>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
