name: NORTHMINE Agent Gates

on:
  pull_request:
  push:
    branches: [main, feature/operational-agent-hardening]

jobs:
  deterministic-agent-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Install frontend
        run: npm ci --legacy-peer-deps --prefix frontend
      - name: Checklist gate
        run: npm run agent:checklist
      - name: Agent harness
        run: npm run agent:harness
      - name: Agent demo contract
        run: npm run agent:demo:harness -- --scenario=full_operational_demo
      - name: Production build
        run: npm run build
      - name: Backend tests
        id: backend_tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest backend/tests -q --basetemp=.pytest_tmp_ci 2>&1 | tee .pytest-output.log
      - name: Publish backend failure annotation
        if: failure() && steps.backend_tests.outcome == 'failure'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path('.pytest-output.log')
          lines = output.read_text(encoding='utf-8', errors='replace').splitlines()
          summary = ('\n'.join(lines[-80:]) or 'pytest failed without captured output')[-8000:]
          summary = summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Backend pytest failure::{summary}')
          PY
      - name: Frontend tests
        run: npm --prefix frontend run test:unit
      - name: Typecheck
        run: npm run lint
